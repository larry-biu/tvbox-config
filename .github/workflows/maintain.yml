name: Automatic maintenance and deployment
on:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'source/**'
      - 'live/**'
      - '.github/workflows/maintain.yml'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Test retaining the last good configuration without changing sources'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
concurrency:
  group: tvbox-maintenance-and-pages
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test failure preservation and source adaptation
        run: python -m unittest discover -s scripts -p 'test_*.py' -q
      - name: Prepare bounded video decoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
      - name: Refresh allowed upstreams and audit published live sources
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            python scripts/maintenance.py --simulate-upstream-failure
          else
            python scripts/maintenance.py
            python scripts/refresh_bestfan.py
          fi
      - name: Decode priority channels and check refresh freshness
        if: inputs.simulate_failure != true
        run: python scripts/parents_monitor.py
      - name: Rebuild publication checksums after maintenance
        run: |
          python scripts/build.py
          python scripts/build.py --check
      - name: Commit verified publication and maintenance receipt
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add assets source live '*.json'
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: refresh configuration and health receipt'
          fi
          # Rebase only the verified commit. Conflicts fail closed and preserve the last published site.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              exit 1
            fi
            python -m unittest discover -s scripts -p 'test_*.py' -q
            python scripts/build.py --check
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Concurrent update or push failure; publication stopped.' >&2
          exit 1
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: .
      - name: Deploy verified files
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify public configuration, JAR and catalogs after deployment
        run: python scripts/verify_public.py --base https://larry-biu.github.io/tvbox-config
      - name: Preserve run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maintenance-receipt-${{ github.run_id }}
          path: |
            health.json
            public-readback.json
            manifest.json
            parents-health.json
          retention-days: 30
      - name: Notify owner only on actionable failure or recovery
        if: always() && inputs.simulate_failure != true
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTENANCE_FAILED: ${{ job.status == 'failure' }}
        run: python scripts/parents_alert.py
